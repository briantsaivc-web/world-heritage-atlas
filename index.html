<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>世界遺產大全</title>
<meta name="description" content="UNESCO 世界遺產名錄全覽：依地區、國家、類型、年代、瀕危狀態與地圖瀏覽，每處附照片與介紹。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#1b1a20; --bg2:#232229; --panel:#2a2931; --line:#3d3b46; --fg:#ece7dc; --muted:#a59f92; --accent:#c9a35a; --accent2:#8fa9cc; --danger:#d9705f; --warm:#2a2318;
  --c-cultural:#c9a35a; --c-natural:#5fa86f; --c-mixed:#8f7bc4;
  --serif:"Noto Serif TC","Cormorant Garamond",Georgia,"PMingLiU",serif; --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; --latin:"Cormorant Garamond",Georgia,serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f5f0e4;--bg2:#ece6d6;--panel:#fffdf7;--line:#d9d1bf;--fg:#211d17;--muted:#6c655a;--accent:#8c6a22;--accent2:#355f85;--danger:#b3432f;--warm:#f7efd9;--c-cultural:#a47a1f;--c-natural:#2f7d46;--c-mixed:#6a54a8;color-scheme:light}}
:root[data-theme="light"]{--bg:#f5f0e4;--bg2:#ece6d6;--panel:#fffdf7;--line:#d9d1bf;--fg:#211d17;--muted:#6c655a;--accent:#8c6a22;--accent2:#355f85;--danger:#b3432f;--warm:#f7efd9;--c-cultural:#a47a1f;--c-natural:#2f7d46;--c-mixed:#6a54a8;color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.7;overflow-x:hidden}
a{color:var(--accent2)}
h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}
button{font:inherit}
.top{position:sticky;top:0;z-index:900;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 16px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.35rem;letter-spacing:.04em;cursor:pointer}
.brand .lat{font-family:var(--latin);font-style:italic;color:var(--muted);font-size:1rem}
.brand .stat{margin-left:auto;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none;align-items:center}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-weight:500;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .sp{margin-left:auto}
.tabs .tool{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--fg);background:var(--panel);margin-left:4px;border-bottom:1px solid var(--line)}
main{padding:18px 16px 70px;max-width:1400px;margin:0 auto}
.lead{color:var(--muted);max-width:70ch;margin:0 0 14px}
.lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--latin);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;color:inherit;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0;border-left:5px solid var(--cc,var(--accent))}
.card:hover{border-color:var(--accent);border-left-color:var(--cc,var(--accent))}
.thumb{position:relative;width:100%;aspect-ratio:4/3;background:var(--bg);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 35%,var(--bg)),var(--bg2));color:var(--muted);font-size:.8rem;text-align:center;padding:8px}
.ph b{font-family:var(--serif);font-size:2rem;color:var(--cc);opacity:.8;line-height:1}
.card .b{padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.card h3{font-size:1.05rem;line-height:1.4}
.card .en{font-family:var(--latin);font-style:italic;color:var(--muted);font-size:.95rem;line-height:1.3}
.card .meta{font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.72rem;line-height:1.6;color:var(--fg);background:var(--bg2)}
.tag.cat{border-color:var(--cc);color:var(--cc)}
.tag.dng{border-color:var(--danger);color:var(--danger);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.82rem;background:var(--bg2);color:var(--fg);cursor:pointer}
.chip.on,.chip:hover{border-color:var(--accent);color:var(--accent)}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{font-size:1.3rem}
.sec .more{margin-left:auto;font-size:.85rem}
.back{background:none;border:0;color:var(--accent2);cursor:pointer;padding:0;margin-bottom:10px}
.inp{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:.9rem;max-width:100%}
.hero{background:linear-gradient(135deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:18px}
.hero h2{font-size:1.6rem;margin-bottom:6px}
.btn{background:var(--accent);color:#1b1a20;border:0;border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer}
.wall{columns:260px;column-gap:10px}
.wall a{display:block;position:relative;margin:0 0 10px;break-inside:avoid;border-radius:6px;overflow:hidden;background:var(--panel);cursor:pointer;color:#fff;text-decoration:none;border:1px solid var(--line)}
.wall img{width:100%;display:block;min-height:120px;background:var(--bg2)}
.wall .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.78));font-size:.85rem;line-height:1.35}
.wall .cap small{display:block;opacity:.8;font-size:.72rem}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer;text-align:left;color:inherit}
.rcard:hover{border-color:var(--accent)}
.rcard h3{font-size:1.25rem}.rcard .en{font-family:var(--latin);font-style:italic;color:var(--muted)}
.rcard .n{margin-top:8px;color:var(--muted);font-size:.85rem}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;color:inherit;text-align:left;display:flex;align-items:center;gap:10px;min-width:0}
.ccard:hover{border-color:var(--accent)}
.ccard .fl{font-size:1.6rem;line-height:1}
.ccard .t{min-width:0;display:flex;flex-direction:column}
.ccard .t b{font-weight:500}.ccard .t span{font-size:.78rem;color:var(--muted)}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.cols3 button{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--cc);color:var(--fg);border-radius:6px;padding:10px;cursor:pointer;text-align:center}
.cols3 button.on{border-color:var(--cc);background:var(--bg2)}
.cols3 b{display:block;font-size:1.05rem}.cols3 span{font-size:.8rem;color:var(--muted)}
.crit{background:var(--bg2);border-left:4px solid var(--accent);border-radius:4px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.decade{margin:22px 0 8px;font-family:var(--serif);font-size:1.15rem;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted);margin:8px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:middle}
#map{width:100%;height:calc(100vh - 220px);min-height:420px;border:1px solid var(--line);border-radius:6px;background:var(--bg2)}
#minimap{width:100%;height:260px;border:1px solid var(--line);border-radius:6px;margin:8px 0}
.pop{min-width:170px;font-family:var(--sans)}.pop b{font-size:.95rem}.pop .en{color:#666;font-size:.78rem}
.pop a{cursor:pointer;color:#355f85;font-size:.85rem}
/* site */
.site{max-width:900px;margin:0 auto}
.site .head{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.site h2{font-size:1.9rem;line-height:1.3}
.site .en{font-family:var(--latin);font-style:italic;color:var(--muted);font-size:1.2rem}
.site .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.badge{display:inline-block;min-width:26px;text-align:center;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 6px;font-size:.78rem;font-family:var(--serif);cursor:help;background:var(--bg2)}
.fig{margin:0 0 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fig .im{position:relative;background:var(--bg);cursor:zoom-in}
.fig img{width:100%;max-height:600px;object-fit:contain;display:block}
.fig.main .ph{position:relative;aspect-ratio:16/9}
.fig figcaption{padding:8px 12px;font-size:.78rem;color:var(--muted);line-height:1.5}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gal .fig{margin:0}.gal .fig img{height:200px;object-fit:cover}
.site p{font-size:1.04rem;line-height:1.95;margin:0 0 1em;text-align:justify}
.site h3{font-size:1.2rem;margin:24px 0 8px;color:var(--accent)}
.site ul{padding-left:1.3em;margin:0 0 1em}.site li{margin:.3em 0;line-height:1.8}
.note{background:var(--bg2);border:1px dashed var(--line);border-radius:6px;padding:12px 14px;font-size:.9rem;margin:14px 0}
.note small{color:var(--muted);display:block;margin-top:6px}
.note .d{font-size:.84rem;color:var(--muted);line-height:1.7;margin:6px 0 0;text-align:left}
.nav2{display:flex;justify-content:space-between;gap:10px;margin:28px 0 0}
.nav2 button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 12px;cursor:pointer;max-width:48%;text-align:left}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;z-index:2000;flex-direction:column;align-items:center;justify-content:center;padding:14px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain}
#lb .c{color:#ddd;font-size:.8rem;margin-top:8px;max-width:900px;text-align:center}
#lb .c a{color:#9fc0e6}
#lb .x{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}
footer{color:var(--muted);font-size:.8rem;margin-top:40px;border-top:1px solid var(--line);padding-top:12px;line-height:1.8}
.hidden{display:none}
@media (max-width:600px){.site h2{font-size:1.5rem}.cols3{grid-template-columns:1fr}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.brand .stat{margin-left:0;width:100%}.wall{columns:150px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><h1 onclick="go('#home')">世界遺產大全</h1><span class="lat">World Heritage Atlas</span><span class="stat" id="stat"></span></div>
  <div class="tabs" role="tablist">
    <button data-v="home">總覽</button><button data-v="regions">地區</button><button data-v="countries">國家</button><button data-v="types">類型</button><button data-v="eras">年代</button><button data-v="danger">瀕危</button><button data-v="map">地圖</button><button data-v="search">搜尋</button>
    <span class="sp"></span>
    <button class="tool" id="themebtn" title="切換淺／深色">主題</button>
  </div>
</div>
<main id="main"><p class="lead">載入中…</p></main>
<div id="lb" role="dialog" aria-modal="true"><button class="x" onclick="closeLb()" aria-label="關閉">×</button><img id="lbimg" alt=""><div class="c" id="lbcap"></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const J=n=>fetch('data/'+n+'.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.json()});
const SISTERS=[['西洋藝術流派大全集','https://briantsaivc-web.github.io/art-history-atlas/'],['西洋雕刻演進大全集','https://briantsaivc-web.github.io/sculpture-atlas/'],['希臘神話大全集','https://briantsaivc-web.github.io/greek-myth-atlas/'],['聖經故事大全','https://briantsaivc-web.github.io/bible-atlas/']];
const CATZ={cultural:'文化遺產',natural:'自然遺產',mixed:'複合遺產'};
const CATCH={cultural:'文',natural:'自',mixed:'複'};
const CRIT={i:'人類創造天才的傑作',ii:'在某時期或文化區內，對建築、技術、藝術、城鎮規劃或景觀設計的人類價值交流有重要影響',iii:'為現存或已消逝的文化傳統或文明提供獨特或至少特殊的見證',iv:'展現人類歷史重要階段的建築、建築群、技術組合或景觀的傑出範例',v:'傳統人類聚落、土地或海洋利用的傑出範例，代表一種或多種文化與環境的互動',vi:'與具普世意義的事件、活的傳統、思想、信仰或藝術文學作品有直接或實質關聯',vii:'包含絕妙的自然現象或具罕見自然美與美學重要性的地區',viii:'代表地球演化史主要階段的傑出例證',ix:'代表陸地、淡水、海岸與海洋生態系統及動植物群落演化發展中重要且持續進行的生態與生物過程',x:'包含生物多樣性就地保護最重要的自然棲地'};
const CRITS=Object.keys(CRIT);
let SITES=[],BY={},COUNTRY={},CN=[],REG=[],META={};
const flag=iso=>/^[A-Z]{2}$/.test(iso||'')?String.fromCodePoint(...[...iso].map(c=>127397+c.charCodeAt(0))):'🏳';
const cname=iso=>COUNTRY[iso]?.zh||COUNTRY[iso]?.en||iso;
const sname=s=>s.zh||s.en;
const catColor=c=>`var(--c-${c})`;
const num=s=>parseInt(s.id,10);
function go(h){location.hash=h}
function setTab(v){document.querySelectorAll('.tabs [data-v]').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v))}
function thumbOf(s){const p=s.photos&&s.photos[0];return p?(p.thumb||p.src):''}
function phHtml(s){return `<div class="ph"><b>${CATCH[s.cat]||'遺'}</b><span>照片待補</span></div>`}
function imgOrPh(src,s,alt){
  if(!src) return phHtml(s);
  return `<img src="${esc(src)}" alt="${esc(alt||'')}" loading="lazy" onerror="this.outerHTML=window.PH(${num(s)})">`;
}
window.PH=id=>phHtml(BY[id]||{cat:'cultural'});
function card(s){
  const t=thumbOf(s);
  return `<button class="card" style="--cc:${catColor(s.cat)}" onclick="go('#site/${s.id}')"><div class="thumb">${imgOrPh(t,s,sname(s))}</div><div class="b"><h3>${esc(sname(s))}</h3>${s.zh?`<span class="en">${esc(s.en)}</span>`:''}<span class="meta"><span class="tag cat" style="--cc:${catColor(s.cat)}">${CATZ[s.cat]}</span><span>${s.year||''}</span>${s.danger?'<span class="tag dng">瀕危</span>':''}</span><span class="meta">${s.iso.map(i=>flag(i)+' '+esc(cname(i))).join('、')}</span></div></button>`;
}
function cards(list,limit){
  if(!list.length) return '<p class="lead">沒有符合的遺產。</p>';
  const L=limit?list.slice(0,limit):list;
  return `<div class="grid">${L.map(card).join('')}</div>${limit&&list.length>limit?`<p class="lead" style="margin-top:12px">僅顯示前 ${limit} 筆，共 ${list.length} 筆；請縮小條件。</p>`:''}`;
}
const byYear=(a,b)=>(a.year-b.year)||(num(a)-num(b));
function route(){
  closeLb();
  const h=location.hash||'#home'; const mm=h.match(/^#([a-z]+)(?:\/([^\/]+))?(?:\/([^\/]+))?$/)||[0,'home']; const [_,v,a,b]=mm;
  const m=document.getElementById('main'); window.scrollTo(0,0);
  if(window._map){window._map.remove();window._map=null}
  if(window._mini){window._mini.remove();window._mini=null}
  const dec=x=>x?decodeURIComponent(x):x;
  let html='';
  if(v==='home'){setTab('home');html=home()}
  else if(v==='regions'){setTab('regions');html=regionsView()}
  else if(v==='region'){setTab('regions');html=regionPage(a)}
  else if(v==='countries'){setTab('countries');html=countriesView()}
  else if(v==='country'){setTab('countries');html=countryPage(dec(a),dec(b))}
  else if(v==='types'){setTab('types');html=typesView(a,b)}
  else if(v==='eras'){setTab('eras');html=erasView(a)}
  else if(v==='danger'){setTab('danger');html=dangerView()}
  else if(v==='map'){setTab('map');html=mapView()}
  else if(v==='search'){setTab('search');html=searchView(dec(a))}
  else if(v==='site'){setTab('');html=sitePage(a)}
  else {setTab('home');html=home()}
  m.innerHTML=html+footer();
  if(v==='map')setTimeout(drawMap,0);
  if(v==='site')setTimeout(()=>drawMini(a),0);
  if(v==='countries')bindCountryFilter();
  if(v==='search')bindSearch();
}
function footer(){return `<footer>資料來源：UNESCO 世界遺產名錄（CC BY-SA 3.0 IGO）；照片來自 Wikimedia Commons，各依原授權，署名與授權見每張照片下方；介紹文字由 AI 撰寫、經查核。資料版本 ${esc(META.version||'—')}（${esc(META.updated||'—')}）。<br>姊妹站：${SISTERS.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`).join(' · ')}</footer>`}
/* home */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){
  const withP=SITES.filter(s=>thumbOf(s)); const pool=withP.length?withP:SITES;
  const pick=shuffle(pool).slice(0,24);
  const wall=withP.length?`<div class="wall">${pick.map(s=>`<a href="#site/${s.id}"><img src="${esc(thumbOf(s))}" alt="${esc(sname(s))}" loading="lazy" onerror="this.closest('a').style.display='none'"><div class="cap">${esc(sname(s))}<small>${s.iso.map(i=>esc(cname(i))).join('、')} · ${s.year}</small></div></a>`).join('')}</div>`:`<p class="lead">照片尚在補齊中，先以隨機精選遺產代替。</p>${cards(pick)}`;
  return `<section class="hero"><div class="lbl">UNESCO World Heritage List</div><h2>${SITES.length} 處世界遺產，一次看完</h2><p class="lead" style="margin:4px 0 12px">從 1978 年第一批名單到今天：依地區、國家、類型、年代、瀕危狀態與地圖瀏覽，每處附登錄標準與介紹。</p><button class="btn" onclick="go('#site/'+SITES[Math.floor(Math.random()*SITES.length)].id)">隨機看一處 →</button> <button class="chip" onclick="route()" style="margin-left:8px">換一批照片</button></section>
  <div class="sec"><h2>隨機精選</h2><span class="lead" style="margin:0">${withP.length?'點照片進入單頁':'示意'}</span></div>${wall}`;
}
/* regions */
function regionSites(r){return SITES.filter(s=>s.regions.includes(r))}
function regionsView(){
  return `<div class="sec"><h2>五大地區</h2></div><p class="lead">依 UNESCO 地區劃分；跨區遺產會在各區重複計算。</p><div class="rgrid">${REG.map(r=>`<button class="rcard" onclick="go('#region/${r.id}')"><h3>${esc(r.zh)}</h3><div class="en">${esc(r.en)}</div><div class="n">${regionSites(r.id).length} 處遺產 · ${countriesOfRegion(r.id).length} 個國家</div></button>`).join('')}</div>`;
}
function countriesOfRegion(r){const set=new Set();regionSites(r).forEach(s=>s.iso.forEach(i=>set.add(i)));return [...set].map(i=>COUNTRY[i]).filter(Boolean).sort((a,b)=>b.n-a.n)}
function ccards(list){return `<div class="cgrid">${list.map(c=>`<button class="ccard" onclick="go('#country/${c.iso}')"><span class="fl">${flag(c.iso)}</span><span class="t"><b>${esc(c.zh||c.en||c.iso)}</b><span>${c.n} 處</span></span></button>`).join('')}</div>`}
function regionPage(id){
  const r=REG.find(x=>x.id===id); if(!r) return '<p>找不到此地區。</p>';
  return `<button class="back" onclick="go('#regions')">← 地區</button><div class="sec" style="margin-top:0"><h2>${esc(r.zh)}</h2><span class="lead" style="margin:0">${esc(r.en)} · ${regionSites(id).length} 處</span></div>${ccards(countriesOfRegion(id))}`;
}
/* countries */
function countriesView(){
  return `<div class="sec"><h2>國家</h2><span class="lead" style="margin:0">${CN.length} 個國家，依遺產數排序</span></div><input class="inp" id="cq" placeholder="搜尋國家…" style="width:260px;margin-bottom:12px"><div id="clist">${ccards(CN)}</div>`;
}
function bindCountryFilter(){const i=document.getElementById('cq');if(!i)return;i.oninput=()=>{const q=i.value.trim().toLowerCase();document.getElementById('clist').innerHTML=ccards(CN.filter(c=>!q||((c.zh||'')+(c.en||'')+c.iso).toLowerCase().includes(q)))||''}}
function countryPage(iso,filt){
  const c=COUNTRY[iso]; if(!c) return '<p>找不到此國家。</p>';
  const list=SITES.filter(s=>s.iso.includes(iso)).sort(byYear);
  return `<button class="back" onclick="history.length>1?history.back():go('#countries')">← 返回</button><div class="sec" style="margin-top:0"><h2>${flag(iso)} ${esc(c.zh||c.en||iso)}</h2><span class="lead" style="margin:0">${list.length} 處世界遺產（含跨國 ${list.filter(s=>s.trans).length} 處）</span></div>${cards(list)}`;
}
/* types */
function typesView(cat,crit){
  cat=CATZ[cat]?cat:'cultural';
  const all=SITES.filter(s=>s.cat===cat);
  const critList=cat==='cultural'?['i','ii','iii','iv','v','vi']:cat==='natural'?['vii','viii','ix','x']:CRITS;
  let list=all; if(crit&&CRIT[crit]) list=all.filter(s=>s.criteria.includes(crit));
  return `<div class="sec"><h2>依類型</h2></div>
  <div class="cols3">${Object.keys(CATZ).map(k=>`<button class="${k===cat?'on':''}" style="--cc:${catColor(k)}" onclick="go('#types/${k}')"><b>${CATZ[k]}</b><span>${SITES.filter(s=>s.cat===k).length} 處</span></button>`).join('')}</div>
  <div class="lbl" style="margin-top:12px">登錄標準</div>
  <div class="chips"><span class="chip ${!crit?'on':''}" onclick="go('#types/${cat}')">全部（${all.length}）</span>${critList.map(k=>`<span class="chip ${k===crit?'on':''}" title="${esc(CRIT[k])}" onclick="go('#types/${cat}/${k}')">(${k}) ${all.filter(s=>s.criteria.includes(k)).length}</span>`).join('')}</div>
  ${crit&&CRIT[crit]?`<div class="crit"><b>標準 (${crit})</b>　${esc(CRIT[crit])}</div>`:''}
  <p class="lead">${list.length} 處</p>${cards(list.slice().sort(byYear),300)}`;
}
/* eras */
function erasView(dec){
  const decs=[];for(let d=1970;d<=2020;d+=10)decs.push(d);
  const dOf=y=>Math.floor(y/10)*10;
  const cnt=d=>SITES.filter(s=>dOf(s.year)===d).length;
  const cur=dec?parseInt(dec,10):null;
  const chips=`<div class="chips"><span class="chip ${!cur?'on':''}" onclick="go('#eras')">全部</span>${decs.map(d=>`<span class="chip ${cur===d?'on':''}" onclick="go('#eras/${d}')">${d}s（${cnt(d)}）</span>`).join('')}</div>`;
  const ds=cur?[cur]:decs;
  return `<div class="sec"><h2>依登錄年代</h2><span class="lead" style="margin:0">自 1978 年起</span></div>${chips}`+ds.map(d=>{const l=SITES.filter(s=>dOf(s.year)===d).sort(byYear);return l.length?`<div class="decade">${d===1970?'1978–1979':d+'s'}　<span style="color:var(--muted);font-size:.85rem">${l.length} 處</span></div>${cards(l,cur?400:60)}`:''}).join('');
}
/* danger */
function dangerView(){
  const l=SITES.filter(s=>s.danger).sort(byYear);
  return `<div class="sec"><h2>瀕危世界遺產</h2><span class="lead" style="margin:0">${l.length} 處列入《瀕危世界遺產名錄》</span></div><p class="lead">因戰亂、災害、開發或保護不足而處於威脅下的遺產。</p>${cards(l)}`;
}
/* map */
function mapView(){
  const n=SITES.filter(s=>s.coord).length;
  return `<div class="sec"><h2>地圖</h2><span class="lead" style="margin:0">${n} 處有座標</span></div><div class="legend">${Object.keys(CATZ).map(k=>`<span style="--c:${catColor(k)}">${CATZ[k]}</span>`).join('')}<span style="--c:var(--danger)">瀕危（紅框）</span></div><div id="map"></div>`;
}
let _lf=null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(_lf) return _lf;
  _lf=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';s.onload=res;s.onerror=()=>{_lf=null;rej(new Error('leaflet'))};document.head.appendChild(s)});
  return _lf;
}
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function drawMap(){
  const el=document.getElementById('map'); if(!el) return;
  loadLeaflet().then(()=>{
    if(!document.getElementById('map')) return;
    const map=L.map('map',{preferCanvas:true,worldCopyJump:true}).setView([25,20],2); window._map=map;
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
    const col={cultural:cssv('--c-cultural'),natural:cssv('--c-natural'),mixed:cssv('--c-mixed')};
    SITES.forEach(s=>{if(!s.coord)return;
      const mk=L.circleMarker(s.coord,{radius:5,color:s.danger?'#d63a2a':'#222',weight:s.danger?2:1,fillColor:col[s.cat],fillOpacity:.9}).addTo(map);
      mk.bindPopup(()=>`<div class="pop"><b>${esc(sname(s))}</b>${s.zh?`<div class="en">${esc(s.en)}</div>`:''}<div class="en">${CATZ[s.cat]} · ${s.year}${s.danger?' · 瀕危':''}</div><a onclick="go('#site/${s.id}')">查看單頁 →</a></div>`);
    });
  }).catch(()=>{el.innerHTML='<p class="lead" style="padding:16px">地圖載入失敗（無法連線 Leaflet）。</p>'});
}
function drawMini(id){
  const s=BY[id]; const el=document.getElementById('minimap'); if(!s||!el) return;
  loadLeaflet().then(()=>{
    if(!document.getElementById('minimap')) return;
    const map=L.map('minimap',{scrollWheelZoom:false}).setView(s.coord,6); window._mini=map;
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
    L.circleMarker(s.coord,{radius:8,color:'#222',weight:1,fillColor:cssv('--c-'+s.cat),fillOpacity:.95}).addTo(map).bindPopup(esc(sname(s)));
  }).catch(()=>{el.innerHTML='<p class="lead" style="padding:12px">地圖載入失敗。</p>'});
}
/* search */
function searchView(q){
  return `<div class="sec"><h2>搜尋</h2></div><input class="inp" id="sq" placeholder="輸入中英文名稱或國家…" style="width:min(420px,100%)" value="${esc(q||'')}" autofocus><p class="lead" id="scount" style="margin-top:10px"></p><div id="sres"></div>`;
}
function bindSearch(){
  const i=document.getElementById('sq'); if(!i) return;
  const run=()=>{const q=i.value.trim().toLowerCase();const res=document.getElementById('sres');
    if(!q){document.getElementById('scount').textContent=`共 ${SITES.length} 處，輸入關鍵字開始篩選。`;res.innerHTML='';return}
    const l=SITES.filter(s=>((s.zh||'')+' '+s.en+' '+s.iso.map(x=>cname(x)+' '+(COUNTRY[x]?.en||'')+' '+x).join(' ')).toLowerCase().includes(q));
    document.getElementById('scount').textContent=`${l.length} 處符合`;res.innerHTML=cards(l,120)};
  i.oninput=run;run();
}
/* site page */
function critBadges(s){return s.criteria.map(k=>`<span class="badge" title="(${k}) ${esc(CRIT[k]||'')}">${k}</span>`).join(' ')}
function capHtml(p){
  const f=encodeURIComponent((p.file||'').replace(/ /g,'_'));
  const lic=p.license?(p.license_url?`<a href="${esc(p.license_url)}" target="_blank" rel="noopener">${esc(p.license)}</a>`:esc(p.license)):'—';
  return `攝影：${esc(p.artist||'未知')} · 授權：${lic} · 來源：<a href="https://commons.wikimedia.org/wiki/File:${f}" target="_blank" rel="noopener">Wikimedia Commons</a>`;
}
function sitePage(id){
  const s=BY[id]; if(!s) return '<p>找不到這處遺產。</p>';
  const photos=s.photos||[];
  const sib=SITES.filter(x=>x.iso[0]===s.iso[0]).sort((a,b)=>num(a)-num(b)); const i=sib.indexOf(s); const prev=sib[i-1],next=sib[i+1];
  const fig=(p,k,main)=>`<figure class="fig ${main?'main':''}"><div class="im" onclick="openLb('${s.id}',${k})"><img src="${esc(p.src||p.thumb)}" alt="${esc(sname(s))}" ${main?'':'loading="lazy"'} onerror="this.closest('figure').style.display='none'"></div><figcaption>${capHtml(p)}</figcaption></figure>`;
  const mainFig=photos[0]?fig(photos[0],0,true):`<figure class="fig main" style="--cc:${catColor(s.cat)}"><div class="im" style="cursor:default">${phHtml(s)}</div></figure>`;
  const rest=photos.slice(1);
  const ext=(s.ext||[]).length?`；擴展：${s.ext.join('、')}`:'';
  const intro=s.intro?`<p>${esc(s.intro).split(/\n+/).join('</p><p>')}</p>`:`<div class="note"><b>介紹撰寫中</b>${s.en_desc?`<p class="d">${esc(s.en_desc)}</p><small>UNESCO 官方英文簡介（CC BY-SA 3.0 IGO）</small>`:''}</div>`;
  const hl=(s.highlights&&s.highlights.length)?`<h3>重點</h3><ul>${s.highlights.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
  return `<article class="site"><button class="back" onclick="history.length>1?history.back():go('#home')">← 返回</button>
  <div class="head"><h2>${esc(sname(s))}</h2>${s.zh?`<div class="en">${esc(s.en)}</div>`:''}
  <div class="tags"><span class="tag cat" style="--cc:${catColor(s.cat)}">${CATZ[s.cat]}</span>${s.trans?'<span class="tag">跨國遺產</span>':''}${s.danger?'<span class="tag dng">瀕危世界遺產</span>':''}<span class="tag">登錄 ${s.year}${ext}</span>${critBadges(s)}</div>
  <div class="chips">${s.iso.map(c=>`<span class="chip" onclick="go('#country/${c}')">${flag(c)} ${esc(cname(c))}</span>`).join('')}</div></div>
  ${mainFig}${rest.length?`<div class="gal">${rest.map((p,k)=>fig(p,k+1,false)).join('')}</div>`:''}
  <h3>介紹</h3>${intro}${hl}
  ${s.coord?`<h3>位置</h3><div id="minimap"></div>`:''}
  <p style="font-size:.95rem"><a href="${esc(s.unesco)}" target="_blank" rel="noopener">UNESCO 官方頁 →</a></p>
  <div class="nav2">${prev?`<button onclick="go('#site/${prev.id}')">← ${esc(sname(prev))}</button>`:'<span></span>'}${next?`<button onclick="go('#site/${next.id}')">${esc(sname(next))} →</button>`:''}</div></article>`;
}
function openLb(id,k){
  const s=BY[id];const p=(s.photos||[])[k]; if(!p) return;
  document.getElementById('lbimg').src=p.src||p.thumb;document.getElementById('lbimg').alt=sname(s);
  document.getElementById('lbcap').innerHTML=`${esc(sname(s))}<br>${capHtml(p)}`;
  document.getElementById('lb').classList.add('on');document.body.style.overflow='hidden';
}
function closeLb(){const l=document.getElementById('lb');if(l)l.classList.remove('on');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb()});
document.querySelectorAll('.tabs [data-v]').forEach(b=>b.onclick=()=>go('#'+b.dataset.v));
document.getElementById('themebtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':!matchMedia('(prefers-color-scheme: light)').matches;const t=dark?'light':'dark';r.dataset.theme=t;try{localStorage.setItem('wh-theme',t)}catch(e){}};
try{const t=localStorage.getItem('wh-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
(async()=>{
  const [st,ct,rg]=await Promise.all([J('sites'),J('countries'),J('regions')]);
  let meta={};try{meta=await J('meta')}catch(e){}
  SITES=st;REG=rg;META=meta;SITES.forEach(s=>{s.iso=s.iso||[];s.criteria=s.criteria||[];s.regions=s.regions||[];BY[s.id]=s});
  // countries.json: 以 sites 重新計算筆數與地區，避免欄位錯位影響顯示
  const cnt={};SITES.forEach(s=>s.iso.forEach(i=>cnt[i]=(cnt[i]||0)+1));
  ct.forEach(c=>{COUNTRY[c.iso]={iso:c.iso,zh:c.zh,en:c.en,n:cnt[c.iso]||0}});
  Object.keys(cnt).forEach(i=>{if(!COUNTRY[i])COUNTRY[i]={iso:i,zh:null,en:i,n:cnt[i]}});
  CN=Object.values(COUNTRY).filter(c=>c.n>0).sort((a,b)=>b.n-a.n||(a.zh||'').localeCompare(b.zh||''));
  const k=SITES.reduce((o,s)=>(o[s.cat]++,o),{cultural:0,natural:0,mixed:0});
  document.getElementById('stat').textContent=`${SITES.length} 處 · 文化 ${k.cultural} · 自然 ${k.natural} · 複合 ${k.mixed} · 瀕危 ${SITES.filter(s=>s.danger).length} · ${CN.length} 國`;
  window.addEventListener('hashchange',route);route();
})().catch(e=>{document.getElementById('main').innerHTML='<p>資料載入失敗：'+esc(e.message)+'</p>'});
</script>
</body>
